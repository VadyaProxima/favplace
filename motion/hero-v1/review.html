<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favplace · Hero video v1</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#272727;background:#f4f3f0;font-family:Arial,sans-serif}.hero{height:100svh;min-height:650px;position:relative;overflow:hidden}.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}header{position:relative;z-index:2;display:flex;justify-content:space-between;padding:30px 3.2vw;font-size:14px}a{color:inherit;text-decoration:none}.brand{font:24px Georgia,serif}.copy{position:relative;z-index:1;max-width:470px;height:calc(100% - 96px);display:flex;flex-direction:column;justify-content:center;margin-left:3.2vw;padding-bottom:80px}h1{font:normal clamp(64px,7vw,108px)/.95 Georgia,serif;letter-spacing:-.06em;margin:0 0 28px}p{color:#66615d;font-size:17px;line-height:1.65;max-width:345px;margin:0}.cta{align-self:flex-start;display:inline-block;background:#272727;color:#fff;padding:17px 28px;margin-top:38px;font-size:13px}.transport{position:absolute;z-index:3;bottom:24px;left:3.2vw;right:3.2vw;display:flex;gap:18px;align-items:center;font-size:11px;color:#746c64}.transport button{border:1px solid #c8c0b6;background:#f4f3f0;padding:9px 12px;font:inherit;color:inherit;cursor:pointer}.transport .meta{margin-left:auto;letter-spacing:.1em}.transport input{max-width:230px;flex:1;accent-color:#746c64}@media(max-width:700px){.hero{height:100svh;min-height:760px}.hero video{width:177%;height:68%;top:25%;left:-61%;object-fit:cover}.copy{justify-content:flex-start;padding-top:60px;margin:0 24px;height:auto;max-width:90%}h1{font-size:70px}p{font-size:14px;max-width:290px}.cta{margin-top:20px}header{padding:24px}.transport{left:24px;right:24px}.transport .meta{display:none}}@media(prefers-reduced-motion:reduce){video{visibility:hidden}.hero{background:#f4f3f0 url('./ae-final.png') center/cover no-repeat}}
</style>
<section class="hero">
<video id="video" autoplay muted loop playsinline preload="auto" poster="ae-final.png" src="favplace-hero-v1.mp4"></video>
<header><a class="brand" href="https://favplace.ru">Favplace</a><a href="http://localhost:3000/create">Конструктор</a></header>
<div class="copy"><h1>Favplace</h1><p>Рельеф вашего места — в металле.<br>Настоящая топография, отлитая в кольцо.</p><a class="cta" href="http://localhost:3000/create">Создать кольцо</a></div>
<div class="transport"><button id="play">Пауза</button><input id="seek" type="range" min="0" max="10" step=".01" value="0"><span id="time">0.00</span><span class="meta">ЭЛЬБРУС → МЕТАЛЛ · V1 · 10 SEC</span></div>
</section>
<script>
const video=document.querySelector('#video'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
if(matchMedia('(prefers-reduced-motion:reduce)').matches)video.pause();
play.onclick=()=>{if(video.paused)video.play();else video.pause()};video.onplay=()=>play.textContent='Пауза';video.onpause=()=>play.textContent='Старт';video.ontimeupdate=()=>{seek.value=video.currentTime;time.textContent=video.currentTime.toFixed(2)};seek.oninput=()=>video.currentTime=Number(seek.value);
</script></html>
